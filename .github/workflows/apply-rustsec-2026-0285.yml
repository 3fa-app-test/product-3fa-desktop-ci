name: apply-rustsec-2026-0285

on:
  push:
    branches:
      - security/rustsec-2026-0285-20261001

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f
        with:
          tool: cargo-audit@0.22.2
      - name: Refresh vulnerable and yanked lockfile entries
        run: |
          set -euo pipefail
          cargo update -p rustls@0.23.43 --precise 0.23.45
          cargo update -p chacha20@0.10.1
      - name: Prove refreshed lockfile
        run: |
          set -euo pipefail
          cargo check --locked
          cargo audit --deny warnings
      - name: Publish source-only lockfile update
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-rustsec-2026-0285.yml
          git add Cargo.lock
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: refresh RustSec-affected dependencies'
          git push origin HEAD:security/rustsec-2026-0285-20261001
