name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: ./.github/workflows/ci.yml
      - name: No build artifacts or env files tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(target/|\.direnv/|\.env$|result$)' || true)
          if [ -n "$bad" ]; then echo "forbidden tracked files:"; echo "$bad"; exit 1; fi
      - name: Formal lifecycle and session models
        run: |
          python3 formal/session_model.py
          python3 formal/app_lifecycle_model.py
      - name: Formal session JSON-lines deadline witness
        run: |
          printf '%s\n' \
            '{"op":"replay","events":[{"op":"unlock"},{"op":"advance","seconds":90},{"op":"poll"}]}' \
            | python3 formal/session_model.py --json-stdin
      # The Slint GUI needs display/system deps; the core library is explicitly
      # designed to build and test headless (see Cargo.toml `gui` feature note).
      - run: cargo check --no-default-features
      - run: cargo test --no-default-features

  # The shipped app, with the GUI and networking actually compiled.
  #
  # macOS rather than Ubuntu on purpose: Slint builds on a mac runner with no
  # extra system packages, and it is a platform the app actually ships on.
  # Compiling and unit-testing need no display — only running the GUI would.
  gui:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup component add clippy
      - run: cargo check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: cargo fmt --check

  interface-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify immutable generated-interface provenance
        run: python3 scripts/check_vendored_interfaces.py
      - name: Verify legacy JSON parity and canonical Signal re-exports
        run: cargo test --no-default-features --test interface_pin
