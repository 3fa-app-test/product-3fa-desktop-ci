name: WASM desktop runtime cross-org E2E

on:
  pull_request:
    paths:
      - '.github/workflows/wasm-desktop-runtime-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WASMX_DAEMON_SHA: d8999b344ff5fdb703fb037a4dffeeda60baed36
  LL_DAEMON_SHA: 49a883262728cef5429c570832af9b506ae9279d

jobs:
  cross-runtime-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install runtime test tools
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wabt

      - name: Clone exact production daemon revisions
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-tags https://github.com/wasm-xprs/wasmx-desktop-daemon.git wasmx-daemon
          git -C wasmx-daemon checkout --detach "$WASMX_DAEMON_SHA"
          test "$(git -C wasmx-daemon rev-parse HEAD)" = "$WASMX_DAEMON_SHA"

          git clone --quiet --filter=blob:none --no-tags https://github.com/lunatic-lorry/ll-desktop-daemon.git ll-daemon
          git -C ll-daemon checkout --detach "$LL_DAEMON_SHA"
          test "$(git -C ll-daemon rev-parse HEAD)" = "$LL_DAEMON_SHA"

      - name: Re-run wasm-xprs deterministic suite at declared MSRV
        run: |
          set -euo pipefail
          cargo +1.96.0 fmt --manifest-path wasmx-daemon/Cargo.toml --all -- --check
          cargo +1.96.0 test --manifest-path wasmx-daemon/Cargo.toml --all-targets
          cargo +1.96.0 clippy --manifest-path wasmx-daemon/Cargo.toml --all-targets -- -D warnings -A clippy::needless_return

      - name: Re-run Lunatic Lorry deterministic suite at declared MSRV
        run: |
          set -euo pipefail
          cargo +1.90.0 fmt --manifest-path ll-daemon/Cargo.toml --all -- --check
          cargo +1.90.0 test --manifest-path ll-daemon/Cargo.toml --all-targets
          cargo +1.90.0 clippy --manifest-path ll-daemon/Cargo.toml --all-targets -- -D warnings -A clippy::needless_return

      - name: Build both desktop daemons
        run: |
          set -euo pipefail
          cargo +1.96.0 build --manifest-path wasmx-daemon/Cargo.toml
          cargo +1.90.0 build --manifest-path ll-daemon/Cargo.toml

      - name: Generate valid provider-specific Wasm fixtures
        run: |
          set -euo pipefail
          mkdir -p fixtures
          cat > fixtures/wasmx-a.wat <<'WAT'
          (module
            (memory (export "memory") 1)
            (func (export "wasmx_main") (result i32)
              i32.const 0))
          WAT
          cat > fixtures/wasmx-b.wat <<'WAT'
          (module
            (memory (export "memory") 1)
            (func (export "wasmx_main") (result i32)
              nop
              i32.const 0))
          WAT
          cat > fixtures/ll-a.wat <<'WAT'
          (module
            (func (export "_start")))
          WAT
          cat > fixtures/ll-b.wat <<'WAT'
          (module
            (func (export "_start")
              nop))
          WAT
          wat2wasm fixtures/wasmx-a.wat -o fixtures/wasmx-a.wasm
          wat2wasm fixtures/wasmx-b.wat -o fixtures/wasmx-b.wasm
          wat2wasm fixtures/ll-a.wat -o fixtures/ll-a.wasm
          wat2wasm fixtures/ll-b.wat -o fixtures/ll-b.wasm
          test "$(sha256sum fixtures/wasmx-a.wasm | cut -d' ' -f1)" != "$(sha256sum fixtures/wasmx-b.wasm | cut -d' ' -f1)"
          test "$(sha256sum fixtures/ll-a.wasm | cut -d' ' -f1)" != "$(sha256sum fixtures/ll-b.wasm | cut -d' ' -f1)"

      - name: Exercise live isolation, immutable deploys, and unique ports
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wasmx-home" "$RUNNER_TEMP/ll-home"

          HOME="$RUNNER_TEMP/wasmx-home" \
          WASMX_DESKTOP_ADDR=127.0.0.1:8766 \
          WASMX_DESKTOP_TOKEN_FILE="$RUNNER_TEMP/wasmx-token" \
          WASMX_ARTIFACT_ROOT="$RUNNER_TEMP/wasmx-artifacts" \
            ./wasmx-daemon/target/debug/wasmx-desktop-daemon >"$RUNNER_TEMP/wasmx.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/wasmx.pid"

          (
            cd ll-daemon
            HOME="$RUNNER_TEMP/ll-home" \
            LL_DESKTOP_ADDR=127.0.0.1:8763 \
            LL_DESKTOP_TOKEN_FILE="$RUNNER_TEMP/ll-token" \
              ./target/debug/ll-desktop-daemon
          ) >"$RUNNER_TEMP/ll.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ll.pid"

          cleanup() {
            kill "$(cat "$RUNNER_TEMP/wasmx.pid")" "$(cat "$RUNNER_TEMP/ll.pid")" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8766/healthz | grep -qx ok \
              && curl --fail --silent http://127.0.0.1:8763/healthz | grep -qx ok; then
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/wasmx.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/wasmx.log"
              exit 1
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/ll.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/ll.log"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8766/healthz | grep -qx ok
          curl --fail --silent http://127.0.0.1:8763/healthz | grep -qx ok
          ss -ltn | grep -q '127.0.0.1:8766'
          ss -ltn | grep -q '127.0.0.1:8763'

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8766/v1/status)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Authorization: Bearer definitely-wrong' http://127.0.0.1:8766/v1/status)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8763/v1/status)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Authorization: Bearer definitely-wrong' http://127.0.0.1:8763/v1/status)" = 401

          WASMX_TOKEN="$(tr -d '\r\n' < "$RUNNER_TEMP/wasmx-token")"
          LL_TOKEN="$(tr -d '\r\n' < "$RUNNER_TEMP/ll-token")"
          test "${#WASMX_TOKEN}" -ge 32
          test "${#LL_TOKEN}" -ge 32
          test "$(stat -c '%a' "$RUNNER_TEMP/wasmx-token")" = 600
          test "$(stat -c '%a' "$RUNNER_TEMP/ll-token")" = 600

          WASMX_A="$(base64 -w0 fixtures/wasmx-a.wasm)"
          WASMX_B="$(base64 -w0 fixtures/wasmx-b.wasm)"
          LL_A="$(base64 -w0 fixtures/ll-a.wasm)"
          LL_B="$(base64 -w0 fixtures/ll-b.wasm)"

          deploy() {
            local url="$1" token="$2" tenant="$3" deployment="$4" wasm="$5" out="$6"
            curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              --data "{\"tenant_id\":\"$tenant\",\"deployment_id\":\"$deployment\",\"wasm_base64\":\"$wasm\"}" \
              "$url/v1/deploy"
          }

          test "$(deploy http://127.0.0.1:8766 "$WASMX_TOKEN" test-tenant stable-generation "$WASMX_A" "$RUNNER_TEMP/wasmx-deploy.json")" = 200
          grep -q '"compiled":true' "$RUNNER_TEMP/wasmx-deploy.json"
          test "$(deploy http://127.0.0.1:8766 "$WASMX_TOKEN" test-tenant stable-generation "$WASMX_A" "$RUNNER_TEMP/wasmx-redeploy.json")" = 200
          code="$(deploy http://127.0.0.1:8766 "$WASMX_TOKEN" test-tenant stable-generation "$WASMX_B" "$RUNNER_TEMP/wasmx-conflict.json")"
          test "$code" -ge 400

          test "$(deploy http://127.0.0.1:8763 "$LL_TOKEN" test-tenant stable-generation "$LL_A" "$RUNNER_TEMP/ll-deploy.json")" = 200
          test "$(deploy http://127.0.0.1:8763 "$LL_TOKEN" test-tenant stable-generation "$LL_A" "$RUNNER_TEMP/ll-redeploy.json")" = 200
          code="$(deploy http://127.0.0.1:8763 "$LL_TOKEN" test-tenant stable-generation "$LL_B" "$RUNNER_TEMP/ll-conflict.json")"
          test "$code" -ge 400

          for invocation in 1 2; do
            code="$(curl --silent --show-error --output "$RUNNER_TEMP/wasmx-invoke-$invocation.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $WASMX_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"invocation_id\":\"wasmx-failure-$invocation\",\"tenant_id\":\"test-tenant\",\"deployment_id\":\"stable-generation\",\"payload_json\":{},\"timeout_ms\":2000}" \
              http://127.0.0.1:8766/v1/invoke)"
            test "$code" = 502
            curl --fail --silent http://127.0.0.1:8766/healthz | grep -qx ok

            test "$(curl --silent --show-error --output "$RUNNER_TEMP/ll-invoke-$invocation.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $LL_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"invocation_id\":\"ll-failure-$invocation\",\"tenant_id\":\"test-tenant\",\"deployment_id\":\"stable-generation\",\"payload_json\":{},\"timeout_ms\":2000}" \
              http://127.0.0.1:8763/v1/invoke)" = 200
            grep -q '"ok":false' "$RUNNER_TEMP/ll-invoke-$invocation.json"
            curl --fail --silent http://127.0.0.1:8763/healthz | grep -qx ok
          done

          curl --fail --silent -H "Authorization: Bearer $WASMX_TOKEN" http://127.0.0.1:8766/v1/status > "$RUNNER_TEMP/wasmx-status.json"
          curl --fail --silent -H "Authorization: Bearer $LL_TOKEN" http://127.0.0.1:8763/v1/status > "$RUNNER_TEMP/ll-status.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          wasmx = json.loads((temp / "wasmx-status.json").read_text())
          assert wasmx["runtime"] == "wasmtime"
          assert wasmx["target_triple"] == "wasm32-unknown-unknown"
          assert wasmx["wasi_enabled"] is False
          assert wasmx["store_per_invocation"] is True
          assert wasmx["accepted"] >= 2
          assert wasmx["completed"] >= 2

          ll = json.loads((temp / "ll-status.json").read_text())
          assert ll["runtime"] == "lunatic_wasm"
          assert ll["actor_reusable"] is False
          assert ll["worker_mode"] == "embedded_fresh_lunatic_actor"
          assert ll["accepted"] >= 2
          assert ll["completed"] >= 2
          assert ll["failed"] >= 2
          PY

          kill "$(cat "$RUNNER_TEMP/wasmx.pid")"
          wait "$(cat "$RUNNER_TEMP/wasmx.pid")" 2>/dev/null || true
          curl --fail --silent http://127.0.0.1:8763/healthz | grep -qx ok

      - name: Dump daemon logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/wasmx.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/ll.log" 2>/dev/null || true
