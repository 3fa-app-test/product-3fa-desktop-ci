name: WASM desktop runtime multi-tenant stress

on:
  pull_request:
    paths:
      - '.github/workflows/wasm-desktop-runtime-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WASMX_DAEMON_SHA: d8999b344ff5fdb703fb037a4dffeeda60baed36
  LL_DAEMON_SHA: 49a883262728cef5429c570832af9b506ae9279d

jobs:
  concurrent-multi-tenant:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchains and WAT compiler
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          rustup toolchain install 1.90.0 --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wabt

      - name: Clone and build exact production revisions
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-tags https://github.com/wasm-xprs/wasmx-desktop-daemon.git wasmx-daemon
          git -C wasmx-daemon checkout --detach "$WASMX_DAEMON_SHA"
          test "$(git -C wasmx-daemon rev-parse HEAD)" = "$WASMX_DAEMON_SHA"
          cargo +1.96.0 build --manifest-path wasmx-daemon/Cargo.toml

          git clone --quiet --filter=blob:none --no-tags https://github.com/lunatic-lorry/ll-desktop-daemon.git ll-daemon
          git -C ll-daemon checkout --detach "$LL_DAEMON_SHA"
          test "$(git -C ll-daemon rev-parse HEAD)" = "$LL_DAEMON_SHA"
          cargo +1.90.0 build --manifest-path ll-daemon/Cargo.toml

      - name: Exercise concurrent tenants in both resident daemons
        run: |
          set -euo pipefail
          mkdir -p fixtures "$RUNNER_TEMP/wasmx-home" "$RUNNER_TEMP/ll-home"
          cat > fixtures/wasmx.wat <<'WAT'
          (module
            (memory (export "memory") 1)
            (func (export "wasmx_main") (result i32)
              i32.const 0))
          WAT
          cat > fixtures/ll.wat <<'WAT'
          (module
            (func (export "_start")))
          WAT
          wat2wasm fixtures/wasmx.wat -o fixtures/wasmx.wasm
          wat2wasm fixtures/ll.wat -o fixtures/ll.wasm

          HOME="$RUNNER_TEMP/wasmx-home" \
          WASMX_DESKTOP_ADDR=127.0.0.1:8766 \
          WASMX_DESKTOP_TOKEN_FILE="$RUNNER_TEMP/wasmx-token" \
          WASMX_ARTIFACT_ROOT="$RUNNER_TEMP/wasmx-artifacts" \
            ./wasmx-daemon/target/debug/wasmx-desktop-daemon >"$RUNNER_TEMP/wasmx-stress.log" 2>&1 &
          WASMX_PID=$!

          (
            cd ll-daemon
            HOME="$RUNNER_TEMP/ll-home" \
            LL_DESKTOP_ADDR=127.0.0.1:8763 \
            LL_DESKTOP_TOKEN_FILE="$RUNNER_TEMP/ll-token" \
              ./target/debug/ll-desktop-daemon
          ) >"$RUNNER_TEMP/ll-stress.log" 2>&1 &
          LL_PID=$!

          cleanup() { kill "$WASMX_PID" "$LL_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8766/healthz | grep -qx ok \
              && curl --fail --silent http://127.0.0.1:8763/healthz | grep -qx ok; then
              break
            fi
            kill -0 "$WASMX_PID" 2>/dev/null || { cat "$RUNNER_TEMP/wasmx-stress.log"; exit 1; }
            kill -0 "$LL_PID" 2>/dev/null || { cat "$RUNNER_TEMP/ll-stress.log"; exit 1; }
            sleep 1
          done

          WASMX_TOKEN="$(tr -d '\r\n' < "$RUNNER_TEMP/wasmx-token")"
          LL_TOKEN="$(tr -d '\r\n' < "$RUNNER_TEMP/ll-token")"
          WASMX_MODULE="$(base64 -w0 fixtures/wasmx.wasm)"
          LL_MODULE="$(base64 -w0 fixtures/ll.wasm)"

          deploy() {
            local url="$1" token="$2" tenant="$3" wasm="$4"
            test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              --data "{\"tenant_id\":\"$tenant\",\"deployment_id\":\"burst-generation\",\"wasm_base64\":\"$wasm\"}" \
              "$url/v1/deploy")" = 200
          }

          for tenant in burst-a burst-b; do
            deploy http://127.0.0.1:8766 "$WASMX_TOKEN" "$tenant" "$WASMX_MODULE"
            deploy http://127.0.0.1:8763 "$LL_TOKEN" "$tenant" "$LL_MODULE"
          done

          pids=''
          for i in $(seq 1 16); do
            tenant=burst-a
            if (( i % 2 == 0 )); then tenant=burst-b; fi
            (
              code="$(curl --silent --show-error --output "$RUNNER_TEMP/wasmx-burst-$i.json" --write-out '%{http_code}' \
                -H "Authorization: Bearer $WASMX_TOKEN" -H 'Content-Type: application/json' \
                --data "{\"invocation_id\":\"wasmx-burst-$i\",\"tenant_id\":\"$tenant\",\"deployment_id\":\"burst-generation\",\"payload_json\":{},\"timeout_ms\":3000}" \
                http://127.0.0.1:8766/v1/invoke)"
              test "$code" = 502
            ) &
            pids="$pids $!"
          done
          for pid in $pids; do wait "$pid"; done

          pids=''
          for i in $(seq 1 16); do
            tenant=burst-a
            if (( i % 2 == 0 )); then tenant=burst-b; fi
            (
              test "$(curl --silent --show-error --output "$RUNNER_TEMP/ll-burst-$i.json" --write-out '%{http_code}' \
                -H "Authorization: Bearer $LL_TOKEN" -H 'Content-Type: application/json' \
                --data "{\"invocation_id\":\"ll-burst-$i\",\"tenant_id\":\"$tenant\",\"deployment_id\":\"burst-generation\",\"payload_json\":{},\"timeout_ms\":3000}" \
                http://127.0.0.1:8763/v1/invoke)" = 200
              grep -q '"ok":false' "$RUNNER_TEMP/ll-burst-$i.json"
            ) &
            pids="$pids $!"
          done
          for pid in $pids; do wait "$pid"; done

          curl --fail --silent http://127.0.0.1:8766/healthz | grep -qx ok
          curl --fail --silent http://127.0.0.1:8763/healthz | grep -qx ok
          curl --fail --silent -H "Authorization: Bearer $WASMX_TOKEN" http://127.0.0.1:8766/v1/status > "$RUNNER_TEMP/wasmx-stress-status.json"
          curl --fail --silent -H "Authorization: Bearer $LL_TOKEN" http://127.0.0.1:8763/v1/status > "$RUNNER_TEMP/ll-stress-status.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          wasmx = json.loads((root / 'wasmx-stress-status.json').read_text())
          assert wasmx['runtime'] == 'wasmtime'
          assert wasmx['store_per_invocation'] is True
          assert wasmx['wasi_enabled'] is False
          assert wasmx['accepted'] >= 16
          assert wasmx['completed'] >= 16
          ll = json.loads((root / 'll-stress-status.json').read_text())
          assert ll['runtime'] == 'lunatic_wasm'
          assert ll['actor_reusable'] is False
          assert ll['worker_mode'] == 'embedded_fresh_lunatic_actor'
          assert ll['accepted'] >= 16
          assert ll['completed'] >= 16
          assert ll['failed'] >= 16
          PY

      - name: Dump stress logs on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/wasmx-stress.log" 2>/dev/null || true
          cat "$RUNNER_TEMP/ll-stress.log" 2>/dev/null || true
