# Supply-chain gates for this repository: RustSec advisories against the
# committed Cargo.lock, and a secret scan of the working tree.
#
# Kept out of ci.yml on purpose. These checks answer "is anything we depend on,
# or anything we committed, known-bad *today*", so they can turn red without a
# single line of this repo changing. Giving them their own workflow keeps that
# signal legible instead of looking like a flaky build.
#
# The cargo-audit setup is copied from 3FA-mcp-server.rs, the only repo in the
# family that already ran this gate, rather than inventing a second pattern.
#
# NOTE: `cargo audit` is red on this branch, and that is the intended outcome.
# See the pull request that introduced this file for the four RustSec
# advisories currently reachable from Cargo.lock. Do not add
# `continue-on-error` here; fix or explicitly `--ignore` an advisory instead.
name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # ci.yml lints only itself, so this workflow validates its own syntax.
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: ./.github/workflows/security.yml
      # Prebuilt binary served from the runner tool cache, so this costs seconds
      # rather than a from-source build of cargo-audit on every run.
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-audit@0.22.2
      # Cargo.lock is committed here (it is not gitignored), so the audit sees
      # exactly the versions CI builds and no lockfile has to be generated first.
      # Auditing the lockfile also covers the GUI dependency tree, which the
      # headless `--no-default-features` build never compiles.
      - name: RustSec advisory audit
        run: cargo audit --deny warnings

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Production SOPS recipient policy
        run: python3 scripts/verify-sops-release-policy.py .sops.yaml prod
      # `dir` scans the checked-out tree, not history. History scanning across
      # this family surfaces long-deleted test fixtures and is slow enough that
      # nobody would keep it required; what ships is what is in the tree.
      #
      # This repo's OTP tests embed the RFC 4226 test-vector secret and fake
      # session tokens; gitleaks v8.30.1's default rules do not match any of
      # them, so no allowlist is needed and none is added.
      - name: Secret scan (working tree)
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: dir --redact --no-banner --exit-code 1 .
